<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>墨圈猎场 · HTML Demo</title>
  <style>
    :root{
      --bg:#0f1517;
      --panel:rgba(17,24,26,.78);
      --panel-2:rgba(255,255,255,.065);
      --text:#f5f2e8;
      --muted:#aab6b4;
      --accent:#f2a65a;
      --ink:#f3dfb3;
      --danger:#e6655b;
      --xp:#8fcf82;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    #hud{position:fixed;left:18px;top:16px;display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none}
    .row{display:flex;align-items:center;gap:10px}
    .pill{min-height:36px;padding:8px 12px;border:1px solid rgba(255,255,255,.10);background:var(--panel);backdrop-filter:blur(14px);border-radius:12px;box-shadow:0 7px 24px rgba(0,0,0,.18);font-size:13px;letter-spacing:.02em}
    .stat strong{font-size:16px;margin-left:5px}
    .bar{width:min(280px,55vw);height:10px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
    .bar>i{display:block;height:100%;width:50%;border-radius:inherit;transition:width .15s ease}
    #hpFill{background:linear-gradient(90deg,#e6655b,#f3a56f)}
    #xpFill{background:linear-gradient(90deg,#76bf77,#c7d87c)}
    #hint{position:fixed;right:18px;top:16px;z-index:4;max-width:330px;line-height:1.55;color:#dfe6df;font-size:13px;pointer-events:none}
    #hint b{color:#fff4d7}
    #message{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:5;font-size:22px;font-weight:800;letter-spacing:.08em;text-shadow:0 3px 12px rgba(0,0,0,.35);opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap}
    #levelup,#gameover{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,9,10,.58);backdrop-filter:blur(7px);padding:20px}
    .modal{width:min(760px,94vw);border:1px solid rgba(255,255,255,.10);border-radius:24px;background:rgba(21,29,31,.96);padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.38)}
    .modal h2{margin:0 0 6px;font-size:25px}.modal p{margin:0 0 18px;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{appearance:none;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);color:var(--text);border-radius:18px;padding:18px;text-align:left;cursor:pointer;min-height:152px;transition:transform .13s ease,border-color .13s ease,background .13s ease}
    .card:hover{transform:translateY(-3px);border-color:rgba(242,166,90,.55);background:rgba(242,166,90,.09)}
    .card .icon{font-size:28px}.card h3{margin:10px 0 6px;font-size:17px}.card p{margin:0;font-size:13px;line-height:1.45}
    #restart{border:0;background:#f1d69f;color:#202526;font-weight:800;border-radius:12px;padding:12px 18px;cursor:pointer}
    #mobile{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
    #stickBase{position:absolute;left:24px;bottom:28px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);pointer-events:auto;touch-action:none}
    #stickKnob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:rgba(243,223,179,.82);box-shadow:0 7px 18px rgba(0,0,0,.24)}
    #mobileTip{position:absolute;right:20px;bottom:30px;max-width:170px;padding:10px 12px;border-radius:13px;background:rgba(15,21,23,.72);font-size:12px;color:#d6dedb;line-height:1.45}
    @media (max-width:760px){
      #hint{top:auto;bottom:18px;right:14px;max-width:190px;font-size:11px}
      #hud{left:12px;top:10px}.pill{font-size:11px;padding:7px 9px;min-height:32px}.stat strong{font-size:14px}.cards{grid-template-columns:1fr}.card{min-height:auto}.modal{max-height:90vh;overflow:auto;padding:18px}.modal h2{font-size:22px}
      #mobile{display:block}
      #hint{display:none}
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="row">
      <div class="pill stat">等级 <strong id="levelText">1</strong></div>
      <div class="pill stat">击杀 <strong id="killText">0</strong></div>
      <div class="pill stat">时间 <strong id="timeText">00:00</strong></div>
    </div>
    <div class="pill">
      <div class="row"><span>生命</span><div class="bar"><i id="hpFill"></i></div><span id="hpText">100/100</span></div>
      <div class="row" style="margin-top:7px"><span>经验</span><div class="bar"><i id="xpFill"></i></div><span id="xpText">0/10</span></div>
    </div>
  </div>

  <div id="hint" class="pill">
    <b>WASD / 方向键</b>移动。你走过的位置会留下画笔轨迹。<br>
    当轨迹<b>回到较早的线段附近</b>形成闭合区域时，圈内敌人会被瞬间清除。<br>
    敌人平时只会游荡，进入它的<b>视野范围</b>后才会追击。
  </div>
  <div id="message"></div>

  <div id="levelup">
    <div class="modal">
      <h2>选择一次强化</h2>
      <p>每次升级只选一个。这个 Demo 的升级会直接改变“画圈”和生存节奏。</p>
      <div id="upgradeCards" class="cards"></div>
    </div>
  </div>

  <div id="gameover">
    <div class="modal" style="max-width:520px;text-align:center">
      <h2>画笔折断了</h2>
      <p id="summary">本局结束</p>
      <button id="restart">重新开始</button>
    </div>
  </div>

  <div id="mobile">
    <div id="stickBase"><div id="stickKnob"></div></div>
    <div id="mobileTip">拖动左下摇杆移动。移动轨迹闭合后会自动发动“圈杀”。</div>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ui = {
    level: document.getElementById('levelText'), kill: document.getElementById('killText'), time: document.getElementById('timeText'),
    hp: document.getElementById('hpText'), xp: document.getElementById('xpText'), hpFill: document.getElementById('hpFill'), xpFill: document.getElementById('xpFill'),
    message: document.getElementById('message'), levelup: document.getElementById('levelup'), cards: document.getElementById('upgradeCards'),
    gameover: document.getElementById('gameover'), summary: document.getElementById('summary'), restart: document.getElementById('restart')
  };

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  function resize(){
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  const world = { w: 3600, h: 3600 };
  const keys = new Set();
  const player = {
    x: world.w/2, y: world.h/2, r: 13, speed: 220,
    hp: 100, maxHp: 100, invuln: 0,
    pickup: 85, closureRadius: 28, minLoopArea: 2300,
    trailWidth: 7, maxTrail: 520, inkLife: 16,
    level: 1, xp: 0, xpNeed: 12
  };

  let enemies = [], orbs = [], particles = [], flashes = [];
  let trail = [];
  let kills = 0, elapsed = 0, spawnClock = 0, difficulty = 1, paused = false, dead = false;
  let msgTimer = 0;

  const camera = {x:player.x,y:player.y};

  const rand = (a,b)=>a+Math.random()*(b-a);
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};
  const length = (x,y)=>Math.hypot(x,y);

  function fmtTime(s){
    s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }

  function showMessage(text){
    ui.message.textContent=text; ui.message.style.opacity='1'; msgTimer=1.1;
  }

  function polygonArea(poly){
    let a=0;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++) a += (poly[j].x*poly[i].y - poly[i].x*poly[j].y);
    return Math.abs(a*0.5);
  }

  function pointInPoly(x,y,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
      const hit=((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi);
      if(hit) inside=!inside;
    }
    return inside;
  }

  function addParticle(x,y,kind='ink',count=7){
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2, s=rand(30,150);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.75),max:.75,size:rand(2,5),kind});
    }
  }

  function spawnEnemy(forceNear=false){
    const angle=Math.random()*Math.PI*2;
    let radius=forceNear?rand(470,680):rand(560,1050);
    let x=clamp(player.x+Math.cos(angle)*radius,60,world.w-60);
    let y=clamp(player.y+Math.sin(angle)*radius,60,world.h-60);
    const roll=Math.random();
    const type = roll < Math.min(.12 + elapsed/600, .24) ? 'swift' : roll > .91 ? 'watcher' : 'drifter';
    const data = type==='swift' ? {r:10,speed:132,sight:190,color:'#e8a15c',damage:10,xp:2}
      : type==='watcher' ? {r:16,speed:86,sight:330,color:'#a77aa8',damage:16,xp:3}
      : {r:13,speed:96,sight:245,color:'#d96159',damage:12,xp:1};
    enemies.push({x,y,...data,type,state:'wander',angle:Math.random()*Math.PI*2,wanderT:rand(.5,2.5),alert:0,attackCd:0,hitFlash:0,seed:Math.random()*9});
  }

  for(let i=0;i<26;i++) spawnEnemy(i<12);

  function killEnemy(e, byLoop=true){
    if(e.dead) return;
    e.dead=true; kills++;
    addParticle(e.x,e.y,'enemy',10);
    const n=e.xp;
    for(let i=0;i<n;i++) orbs.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),vx:rand(-20,20),vy:rand(-20,20),value:1});
    if(byLoop && kills%20===0) showMessage('漂亮！ '+kills+' 连斩');
  }

  function tryCloseLoop(){
    const n=trail.length;
    if(n<24) return;
    const cur=trail[n-1];
    let best=-1, bestD=Infinity;
    const r2=player.closureRadius*player.closureRadius;
    for(let i=Math.max(0,n-250); i<n-16; i++){
      const p=trail[i];
      const d=dist2(cur.x,cur.y,p.x,p.y);
      if(d<r2 && d<bestD){best=i;bestD=d;}
    }
    if(best<0) return;
    const poly=trail.slice(best).map(p=>({x:p.x,y:p.y}));
    if(poly.length<16) return;
    const area=polygonArea(poly);
    if(area<player.minLoopArea) return;

    let count=0;
    for(const e of enemies){
      if(!e.dead && pointInPoly(e.x,e.y,poly)){ killEnemy(e,true); count++; }
    }
    flashes.push({poly,life:.55,max:.55,count});
    addParticle(player.x,player.y,'ink',15);
    if(count>0) showMessage('封圈 · '+count+' 杀'); else showMessage('空圈');
    // 完成一次圈后重新起笔，避免同一轨迹连续重复触发。
    trail = [{x:player.x,y:player.y,t:elapsed}];
  }

  function gainXp(v){
    player.xp += v;
    if(player.xp >= player.xpNeed && !paused){
      player.xp -= player.xpNeed;
      player.level++;
      player.xpNeed = Math.floor(12 + player.level*5.5 + player.level*player.level*.55);
      openLevelUp();
    }
  }

  const upgrades = [
    {icon:'➜',name:'轻步',desc:'移动速度 +12%，更容易迅速拉出大圈。',apply:()=>player.speed*=1.12},
    {icon:'◯',name:'宽容收笔',desc:'闭合判定距离 +5px，封圈更容易触发。',apply:()=>player.closureRadius+=5},
    {icon:'✦',name:'长锋画笔',desc:'保留的移动轨迹长度 +18%。',apply:()=>player.maxTrail=Math.floor(player.maxTrail*1.18)},
    {icon:'❤',name:'厚纸',desc:'最大生命 +25，并立即恢复 25。',apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
    {icon:'◎',name:'吸墨',desc:'经验吸取半径 +45。',apply:()=>player.pickup+=45},
    {icon:'⌁',name:'粗笔',desc:'画笔轨迹更明显；封圈时获得 0.45 秒无敌。',apply:()=>{player.trailWidth+=1.8; player.invuln=Math.max(player.invuln,.45)}},
    {icon:'◇',name:'大构图',desc:'最小封圈面积 -14%，小圈也更容易生效。',apply:()=>player.minLoopArea=Math.max(900,player.minLoopArea*.86)},
    {icon:'✚',name:'修补',desc:'立刻恢复 45 点生命。',apply:()=>player.hp=Math.min(player.maxHp,player.hp+45)}
  ];

  function openLevelUp(){
    paused=true; ui.levelup.style.display='flex'; ui.cards.innerHTML='';
    const pool=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
    for(const up of pool){
      const b=document.createElement('button'); b.className='card';
      b.innerHTML=`<div class="icon">${up.icon}</div><h3>${up.name}</h3><p>${up.desc}</p>`;
      b.onclick=()=>{up.apply(); ui.levelup.style.display='none';paused=false;showMessage(up.name+' 已强化');};
      ui.cards.appendChild(b);
    }
  }

  function updateEnemy(e,dt){
    e.attackCd=Math.max(0,e.attackCd-dt); e.hitFlash=Math.max(0,e.hitFlash-dt);
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    if(d < e.sight){ e.state='alert'; e.alert=1.1; }
    else if(e.alert>0){ e.alert-=dt; }
    else e.state='wander';

    let vx=0,vy=0;
    if(e.state==='alert'){
      const inv=1/(d||1); vx=dx*inv*e.speed*(1+Math.min(elapsed/240,.34)); vy=dy*inv*e.speed*(1+Math.min(elapsed/240,.34));
      e.angle=Math.atan2(vy,vx);
    }else{
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rand(1,3.4);e.angle+=rand(-1.6,1.6);}
      vx=Math.cos(e.angle)*e.speed*.27; vy=Math.sin(e.angle)*e.speed*.27;
    }
    e.x=clamp(e.x+vx*dt,e.r,world.w-e.r); e.y=clamp(e.y+vy*dt,e.r,world.h-e.r);

    const rr=player.r+e.r;
    if(d<rr+3 && e.attackCd<=0 && player.invuln<=0){
      player.hp-=e.damage; player.invuln=.55; e.attackCd=.8; e.hitFlash=.18;
      const push=20/(d||1); player.x=clamp(player.x+dx*push,player.r,world.w-player.r); player.y=clamp(player.y+dy*push,player.r,world.h-player.r);
      addParticle(player.x,player.y,'hurt',8);
      if(player.hp<=0) endGame();
    }
  }

  function update(dt){
    if(paused || dead) return;
    elapsed+=dt; difficulty=1+elapsed/75;
    player.invuln=Math.max(0,player.invuln-dt);
    spawnClock-=dt;
    if(spawnClock<=0){
      spawnClock=Math.max(.22,1.0/difficulty);
      if(enemies.length<180) spawnEnemy();
    }

    let mx=0,my=0;
    if(keys.has('KeyW')||keys.has('ArrowUp')) my--;
    if(keys.has('KeyS')||keys.has('ArrowDown')) my++;
    if(keys.has('KeyA')||keys.has('ArrowLeft')) mx--;
    if(keys.has('KeyD')||keys.has('ArrowRight')) mx++;
    mx+=stick.x; my+=stick.y;
    const ml=Math.hypot(mx,my);
    if(ml>0){
      mx/=ml; my/=ml;
      const ox=player.x,oy=player.y;
      player.x=clamp(player.x+mx*player.speed*dt,player.r,world.w-player.r);
      player.y=clamp(player.y+my*player.speed*dt,player.r,world.h-player.r);
      if(Math.hypot(player.x-ox,player.y-oy)>.01){
        const last=trail[trail.length-1];
        if(!last || dist2(player.x,player.y,last.x,last.y)>9*9){
          trail.push({x:player.x,y:player.y,t:elapsed});
          if(trail.length>player.maxTrail) trail.shift();
          tryCloseLoop();
        }
      }
    }

    for(const e of enemies) if(!e.dead) updateEnemy(e,dt);
    enemies=enemies.filter(e=>!e.dead);

    for(const o of orbs){
      o.x+=o.vx*dt; o.y+=o.vy*dt; o.vx*=Math.pow(.08,dt);o.vy*=Math.pow(.08,dt);
      const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy);
      if(d<player.pickup){const f=1-d/player.pickup;o.x+=dx*dt*(4+f*10);o.y+=dy*dt*(4+f*10);}
      if(d<player.r+8){o.dead=true;gainXp(o.value);}
    }
    orbs=orbs.filter(o=>!o.dead);

    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.09,dt);p.vy*=Math.pow(.09,dt)}
    particles=particles.filter(p=>p.life>0);
    for(const f of flashes) f.life-=dt;
    flashes=flashes.filter(f=>f.life>0);

    camera.x += (player.x-camera.x)*(1-Math.pow(.001,dt));
    camera.y += (player.y-camera.y)*(1-Math.pow(.001,dt));

    if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)ui.message.style.opacity='0';}
    updateUI();
  }

  function updateUI(){
    ui.level.textContent=player.level; ui.kill.textContent=kills; ui.time.textContent=fmtTime(elapsed);
    ui.hp.textContent=Math.ceil(player.hp)+'/'+player.maxHp; ui.xp.textContent=player.xp+'/'+player.xpNeed;
    ui.hpFill.style.width=(100*clamp(player.hp/player.maxHp,0,1))+'%'; ui.xpFill.style.width=(100*clamp(player.xp/player.xpNeed,0,1))+'%';
  }

  function sx(x){return x-camera.x+W/2} function sy(y){return y-camera.y+H/2}
  function visible(x,y,pad=60){const xx=sx(x),yy=sy(y);return xx>-pad&&xx<W+pad&&yy>-pad&&yy<H+pad}

  function drawGrid(){
    ctx.fillStyle='#101719';ctx.fillRect(0,0,W,H);
    const step=58;
    const ox=((W/2-camera.x)%step+step)%step, oy=((H/2-camera.y)%step+step)%step;
    ctx.strokeStyle='rgba(232,226,205,.035)';ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=ox;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}
    for(let y=oy;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}
    ctx.stroke();

    // 大地图边缘提示
    const left=sx(0),right=sx(world.w),top=sy(0),bottom=sy(world.h);
    ctx.strokeStyle='rgba(242,166,90,.18)';ctx.lineWidth=4;ctx.strokeRect(left,top,right-left,bottom-top);
  }

  function drawTrail(){
    if(trail.length<2) return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    // 外发光
    ctx.strokeStyle='rgba(244,180,99,.17)';ctx.lineWidth=player.trailWidth+9;ctx.beginPath();
    ctx.moveTo(sx(trail[0].x),sy(trail[0].y));
    for(let i=1;i<trail.length;i++)ctx.lineTo(sx(trail[i].x),sy(trail[i].y));ctx.stroke();
    // 主笔迹
    ctx.strokeStyle='#efcf98';ctx.lineWidth=player.trailWidth;ctx.beginPath();ctx.moveTo(sx(trail[0].x),sy(trail[0].y));
    for(let i=1;i<trail.length;i++)ctx.lineTo(sx(trail[i].x),sy(trail[i].y));ctx.stroke();
    // 中心高光
    ctx.strokeStyle='rgba(255,248,219,.75)';ctx.lineWidth=Math.max(1.2,player.trailWidth*.24);ctx.stroke();
    ctx.restore();
  }

  function drawFlashes(){
    for(const f of flashes){
      const a=f.life/f.max;
      ctx.beginPath();ctx.moveTo(sx(f.poly[0].x),sy(f.poly[0].y));
      for(let i=1;i<f.poly.length;i++)ctx.lineTo(sx(f.poly[i].x),sy(f.poly[i].y));ctx.closePath();
      ctx.fillStyle=`rgba(242,166,90,${.17*a})`;ctx.fill();
      ctx.strokeStyle=`rgba(255,231,180,${.95*a})`;ctx.lineWidth=3+5*(1-a);ctx.stroke();
    }
  }

  function drawOrbs(){
    for(const o of orbs){if(!visible(o.x,o.y))continue;const x=sx(o.x),y=sy(o.y);ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle='#9bcf7f';ctx.fill();ctx.beginPath();ctx.arc(x-1,y-1,1.4,0,Math.PI*2);ctx.fillStyle='#e8f0be';ctx.fill();}
  }

  function drawEnemy(e){
    if(!visible(e.x,e.y,e.sight+20))return;
    const x=sx(e.x),y=sy(e.y);
    // 只有离玩家足够近时才显示视野圈，避免满屏圆环。
    if(dist2(player.x,player.y,e.x,e.y)<(e.sight+130)*(e.sight+130)){
      ctx.beginPath();ctx.arc(x,y,e.sight,0,Math.PI*2);
      ctx.strokeStyle=e.state==='alert'?'rgba(230,101,91,.19)':'rgba(207,215,205,.055)';ctx.lineWidth=1;ctx.stroke();
    }
    ctx.save();ctx.translate(x,y);ctx.rotate(e.angle);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=e.hitFlash>0?'#fff2d5':e.color;ctx.fill();
    ctx.shadowColor='transparent';
    // 眼睛/朝向
    ctx.fillStyle='#2b2422';ctx.beginPath();ctx.arc(e.r*.36,-e.r*.18,2.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.r*.36,e.r*.18,2.2,0,Math.PI*2);ctx.fill();
    if(e.state==='alert'){
      ctx.strokeStyle='rgba(255,237,190,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r+4,-.6,.6);ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer(){
    const x=sx(player.x),y=sy(player.y);
    ctx.save();ctx.translate(x,y);
    if(player.invuln>0){ctx.beginPath();ctx.arc(0,0,player.r+7+Math.sin(elapsed*22)*2,0,Math.PI*2);ctx.strokeStyle='rgba(255,240,193,.65)';ctx.lineWidth=2;ctx.stroke();}
    ctx.shadowColor='rgba(242,166,90,.32)';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fillStyle='#f2ead4';ctx.fill();
    ctx.shadowColor='transparent';
    ctx.beginPath();ctx.arc(-3,-3,4.2,0,Math.PI*2);ctx.fillStyle='#fffdf4';ctx.fill();
    ctx.fillStyle='#253033';ctx.fillRect(-2,-6,4,13);
    ctx.fillStyle='#d88d52';ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(4,6);ctx.lineTo(0,12);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){if(!visible(p.x,p.y))continue;const a=clamp(p.life/p.max,0,1);const color=p.kind==='enemy'?'rgba(224,100,83,':p.kind==='hurt'?'rgba(255,224,183,':'rgba(241,208,151,';ctx.fillStyle=color+a+')';ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),p.size*a+.5,0,Math.PI*2);ctx.fill();}
  }

  function draw(){
    ctx.clearRect(0,0,W,H); drawGrid(); drawFlashes(); drawOrbs();
    for(const e of enemies) drawEnemy(e);
    drawTrail(); drawParticles(); drawPlayer();
    // 当前笔尖与可闭合范围提示
    if(trail.length>18){ctx.beginPath();ctx.arc(sx(player.x),sy(player.y),player.closureRadius,0,Math.PI*2);ctx.strokeStyle='rgba(243,223,179,.12)';ctx.lineWidth=1;ctx.stroke();}
  }

  function endGame(){
    dead=true;paused=true;player.hp=0;updateUI();ui.gameover.style.display='flex';
    ui.summary.textContent=`坚持 ${fmtTime(elapsed)} · 击杀 ${kills} · 到达等级 ${player.level}`;
  }
  function reset(){
    player.x=world.w/2;player.y=world.h/2;player.speed=220;player.hp=100;player.maxHp=100;player.invuln=0;player.pickup=85;player.closureRadius=28;player.minLoopArea=2300;player.trailWidth=7;player.maxTrail=520;player.level=1;player.xp=0;player.xpNeed=12;
    enemies=[];orbs=[];particles=[];flashes=[];trail=[];kills=0;elapsed=0;spawnClock=0;paused=false;dead=false;camera.x=player.x;camera.y=player.y;ui.gameover.style.display='none';
    for(let i=0;i<26;i++)spawnEnemy(i<12);updateUI();
  }

  addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code)});
  addEventListener('keyup',e=>keys.delete(e.code));
  ui.restart.onclick=reset;

  const stick={x:0,y:0};
  const base=document.getElementById('stickBase'), knob=document.getElementById('stickKnob');
  let stickId=null;
  function setStick(ev){
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=ev.clientX-cx,dy=ev.clientY-cy;const m=Math.hypot(dx,dy),max=42;
    if(m>max){dx=dx/m*max;dy=dy/m*max}
    stick.x=dx/max;stick.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
  }
  base.addEventListener('pointerdown',e=>{stickId=e.pointerId;base.setPointerCapture(stickId);setStick(e)});
  base.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});
  function releaseStick(e){if(stickId===null||e.pointerId===stickId){stickId=null;stick.x=stick.y=0;knob.style.transform='translate(0,0)'}}
  base.addEventListener('pointerup',releaseStick);base.addEventListener('pointercancel',releaseStick);

  let last=performance.now();
  function frame(now){
    const dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame);
  }
  updateUI(); requestAnimationFrame(frame);
})();
</script>
</body>
