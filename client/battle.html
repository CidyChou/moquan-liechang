<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>墨圈猎场 · 1v1 对战</title>
  <style>
    :root{
      --bg:#0b1012;
      --panel:rgba(14,20,22,.72);
      --panel-solid:rgba(16,22,24,.92);
      --text:#f4efe4;
      --muted:#9aa8a5;
      --accent:#e6b56a;
      --ink:#f0dfb6;
      --danger:#e6655b;
      --xp:#8fcf82;
      --line:rgba(240,223,182,.14);
      --glow:rgba(230,181,106,.22);
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
      font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",Inter,"Microsoft YaHei",system-ui,sans-serif}
    body::before{
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(230,181,106,.06), transparent 55%),
        linear-gradient(180deg, rgba(8,10,11,.35), rgba(8,10,11,.72)),
        url('assets/ink-bg.webp') center/cover no-repeat;
      opacity:.95;
    }
    body::after{
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%);
    }
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
    .screen{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:20px}
    .screen.active{display:flex}
    #lobby.screen{background:transparent}
    .lobby-wrap{width:min(420px,94vw);text-align:center;position:relative;z-index:1}
    .lobby-seal{width:96px;height:96px;margin:0 auto 14px;display:block;filter:drop-shadow(0 10px 28px rgba(0,0,0,.45));opacity:.92}
    .lobby-wrap h1{
      margin:0 0 8px;font-size:clamp(30px,5.2vw,36px);font-weight:800;letter-spacing:.18em;
      background:linear-gradient(180deg,#fff6df 0%,var(--ink) 55%,var(--accent) 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));
    }
    .lobby-wrap .sub{margin:0 0 26px;color:var(--muted);font-size:14px;letter-spacing:.08em}
    .lobby-wrap .hint{margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.55;opacity:.9}
    .btn-primary{
      width:100%;height:52px;border:1px solid rgba(240,223,182,.35);border-radius:14px;
      background:linear-gradient(180deg,#f6e2b0,#e2c078);color:#1a1f20;font-weight:800;font-size:16px;
      cursor:pointer;letter-spacing:.06em;
      box-shadow:0 10px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.06) inset;
      transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .btn-primary:hover{filter:brightness(1.03);box-shadow:0 12px 32px rgba(0,0,0,.32),0 0 24px var(--glow)}
    .btn-primary:active{transform:translateY(1px)}
    .btn-primary:disabled{opacity:.55;cursor:not-allowed;filter:none;box-shadow:none}
    .btn-ghost{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:12px;padding:10px 18px;cursor:pointer;font-size:14px;backdrop-filter:blur(8px)}
    .btn-ghost:hover{border-color:rgba(230,181,106,.35);background:rgba(230,181,106,.08)}
    .card-panel{
      width:min(420px,92vw);border:1px solid var(--line);border-radius:22px;
      background:linear-gradient(180deg, rgba(24,32,34,.94), rgba(14,18,20,.96));
      padding:28px 24px;box-shadow:0 24px 70px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.03) inset;
      text-align:center;backdrop-filter:blur(16px);
    }
    .card-panel h2{margin:0 0 8px;font-size:22px;letter-spacing:.06em}
    .card-panel p{margin:0 0 16px;color:var(--muted);font-size:14px}
    .spinner{width:42px;height:42px;margin:0 auto 16px;border-radius:50%;border:3px solid rgba(255,255,255,.10);border-top-color:var(--accent);animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #matchRemain{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:18px;letter-spacing:.04em}
    #readyFlash{background:rgba(5,9,10,.72);backdrop-filter:blur(8px);z-index:9}
    #readyFlash .big{font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--accent);letter-spacing:.18em;margin:0 0 12px;text-shadow:0 0 30px var(--glow)}
    #readyFlash .names{color:var(--muted);font-size:14px;letter-spacing:.06em}

    #hud{position:fixed;left:18px;top:16px;display:none;flex-direction:column;gap:10px;z-index:4;pointer-events:none}
    #hud.show{display:flex}
    .row{display:flex;align-items:center;gap:10px}
    .pill{
      min-height:36px;padding:8px 12px;border:1px solid var(--line);background:var(--panel);
      backdrop-filter:blur(16px);border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:13px;letter-spacing:.03em
    }
    .stat strong{font-size:16px;margin-left:5px;color:var(--ink)}
    .bar{width:min(280px,55vw);height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,255,255,.05)}
    .bar>i{display:block;height:100%;width:50%;border-radius:inherit;transition:width .15s ease}
    #hpFill{background:linear-gradient(90deg,#e6655b,#f3a56f)}
    #xpFill{background:linear-gradient(90deg,#76bf77,#c7d87c)}

    #scoreBar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:4;width:min(420px,92vw);display:none;pointer-events:none}
    #scoreBar.show{display:block}
    .score-card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);border-radius:14px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
    .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .score-side{font-size:12px}
    .score-side .label{color:var(--muted);margin-bottom:2px;letter-spacing:.06em}
    .score-side .nums{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
    .score-side.lead .nums{color:var(--accent)}
    .hearts{letter-spacing:1px;color:var(--danger);font-size:13px}
    .hearts .empty{opacity:.28}
    .prog{margin-top:5px;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#aab6b4,#f2a65a);border-radius:inherit;transition:width .2s ease}
    .score-side.lead .prog>i{background:linear-gradient(90deg,#f2a65a,#f1d69f)}
    #lagTip{display:none;margin-top:6px;text-align:center;font-size:11px;color:var(--accent)}
    #lagTip.on{display:block}

    #message{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:5;font-size:20px;font-weight:800;letter-spacing:.08em;text-shadow:0 3px 12px rgba(0,0,0,.35);opacity:0;transition:opacity .18s ease;pointer-events:none;white-space:nowrap}
    #sysToast{position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:13;background:var(--panel-solid);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;backdrop-filter:blur(12px)}

    #levelup,#revive,#result{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(5,9,10,.62);backdrop-filter:blur(8px);padding:20px}
    #revive{z-index:11;background:rgba(5,9,10,.74)}
    #result{z-index:12}
    .modal{
      width:min(760px,94vw);border:1px solid var(--line);border-radius:22px;
      background:linear-gradient(180deg, rgba(24,32,34,.95), rgba(14,18,20,.97));
      padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.03) inset
    }
    .modal h2{margin:0 0 6px;font-size:25px;letter-spacing:.04em}.modal p{margin:0 0 18px;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);border-radius:18px;padding:18px;text-align:left;cursor:pointer;min-height:152px;transition:transform .13s ease,border-color .13s ease,background .13s ease,box-shadow .13s ease}
    .card:hover{transform:translateY(-3px);border-color:rgba(230,181,106,.5);background:rgba(230,181,106,.09);box-shadow:0 12px 28px rgba(0,0,0,.25)}
    .card .icon{font-size:28px}.card h3{margin:10px 0 6px;font-size:17px}.card p{margin:0;font-size:13px;line-height:1.45}
    .ad-slot{width:100%;height:120px;margin:0 0 16px;border:1.5px dashed rgba(240,223,182,.22);border-radius:14px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;user-select:none}
    .ad-slot small{margin-top:4px;font-size:11px;opacity:.8}
    #reviveCount{font-size:72px;font-weight:800;color:var(--danger);line-height:1;margin:8px 0 16px}
    #resultTitle.win{color:var(--accent)} #resultTitle.lose{color:var(--muted)}

    #mobile{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
    #stickBase{position:absolute;left:24px;bottom:28px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line);pointer-events:auto;touch-action:none;backdrop-filter:blur(8px)}
    #stickKnob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:rgba(240,223,182,.82);box-shadow:0 7px 18px rgba(0,0,0,.24)}
    @media (max-width:760px){
      #hud{left:12px;top:10px}.pill{font-size:11px;padding:7px 9px;min-height:32px}.stat strong{font-size:14px}
      .cards{grid-template-columns:1fr}.card{min-height:auto}.modal{max-height:90vh;overflow:auto;padding:18px}.modal h2{font-size:22px}
      #mobile.show{display:block}
      #reviveCount{font-size:64px}
      .ad-slot{height:120px}
      .lobby-seal{width:84px;height:84px}
    }
    @media (min-width:761px){ .ad-slot{height:160px} }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="lobby" class="screen active">
    <div class="lobby-wrap">
      <img class="lobby-seal" src="assets/ink-seal.webp" alt="" width="96" height="96" />
      <h1>墨圈猎场</h1>
      <p class="sub">1v1 对战 · 先到击杀目标</p>
      <button class="btn-primary" id="btnMatch">开始匹配</button>
      <p class="hint">各打各的图 · 杀敌会塞怪给对手<br><span id="wsHint"></span></p>
    </div>
  </div>

  <div id="matching" class="screen">
    <div class="card-panel">
      <div class="spinner"></div>
      <h2>正在寻找对手…</h2>
      <div id="matchRemain">剩余 15s</div>
      <button class="btn-ghost" id="btnCancel">取消</button>
    </div>
  </div>

  <div id="readyFlash" class="screen">
    <div>
      <p class="big">对战开始！</p>
      <p class="names" id="readyNames">你 · 对手</p>
    </div>
  </div>

  <div id="hud">
    <div class="row">
      <div class="pill stat">等级 <strong id="levelText">1</strong></div>
      <div class="pill stat">时间 <strong id="timeText">00:00</strong></div>
    </div>
    <div class="pill">
      <div class="row"><span>生命</span><div class="bar"><i id="hpFill"></i></div><span id="hpText">100/100</span></div>
      <div class="row" style="margin-top:7px"><span>经验</span><div class="bar"><i id="xpFill"></i></div><span id="xpText">0/12</span></div>
    </div>
  </div>

  <div id="scoreBar">
    <div class="score-card">
      <div class="score-grid">
        <div class="score-side" id="scoreYou">
          <div class="label">你</div>
          <div class="nums"><span class="hearts" id="heartsYou">●●●</span><span id="killYou">0 / 30</span></div>
          <div class="prog"><i id="progYou"></i></div>
        </div>
        <div class="score-side" id="scoreOpp">
          <div class="label">对手</div>
          <div class="nums"><span id="killOpp">0 / 30</span><span class="hearts" id="heartsOpp">●●●</span></div>
          <div class="prog"><i id="progOpp"></i></div>
        </div>
      </div>
      <div id="lagTip">落后补偿生效 · 移速+15%</div>
    </div>
  </div>

  <div id="message"></div>
  <div id="sysToast"></div>

  <div id="levelup">
    <div class="modal">
      <h2>选择一次强化</h2>
      <p>每次升级只选一个</p>
      <div id="upgradeCards" class="cards"></div>
    </div>
  </div>

  <div id="revive">
    <div class="modal" style="max-width:520px;text-align:center">
      <h2>画笔折断了</h2>
      <p>5 秒后自动复活</p>
      <div id="reviveCount">5</div>
      <div class="ad-slot" id="adRevivePlaceholder"><span>广告位 · 复活</span><small>本版仅占位</small></div>
      <p style="margin:0;font-size:12px">免费复活 · 不限次数 · 对手仍在进攻</p>
    </div>
  </div>

  <div id="result">
    <div class="modal" style="max-width:520px;text-align:center">
      <h2 id="resultTitle">猎场封圈</h2>
      <p id="resultScore">你 0 · 对手 0</p>
      <p id="resultMeta" style="margin-top:-8px;font-size:13px"></p>
      <div class="ad-slot" id="adResultPlaceholder"><span>广告位 · 结算</span><small>本版仅占位</small></div>
      <button class="btn-primary" id="btnLobby" style="max-width:280px;margin:0 auto">返回大厅</button>
    </div>
  </div>

  <div id="mobile">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const WS_URL = params.get('ws') || ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  const playerName = params.get('name') || ('猎人' + Math.floor(Math.random()*900+100));

  const el = (id) => document.getElementById(id);
  const canvas = el('game');
  const ctx = canvas.getContext('2d');

  const ui = {
    lobby: el('lobby'), matching: el('matching'), ready: el('readyFlash'),
    hud: el('hud'), scoreBar: el('scoreBar'), mobile: el('mobile'),
    level: el('levelText'), time: el('timeText'),
    hp: el('hpText'), xp: el('xpText'), hpFill: el('hpFill'), xpFill: el('xpFill'),
    message: el('message'), sysToast: el('sysToast'),
    levelup: el('levelup'), cards: el('upgradeCards'),
    revive: el('revive'), reviveCount: el('reviveCount'),
    result: el('result'), resultTitle: el('resultTitle'), resultScore: el('resultScore'), resultMeta: el('resultMeta'),
    matchRemain: el('matchRemain'), readyNames: el('readyNames'),
    killYou: el('killYou'), killOpp: el('killOpp'),
    heartsYou: el('heartsYou'), heartsOpp: el('heartsOpp'),
    progYou: el('progYou'), progOpp: el('progOpp'),
    scoreYou: el('scoreYou'), scoreOpp: el('scoreOpp'), lagTip: el('lagTip'),
    wsHint: el('wsHint'),
  };
  ui.wsHint.textContent = 'WS: ' + WS_URL;

  // ---------- UI screens ----------
  const Screen = { LOBBY:'lobby', MATCHING:'matching', READY:'ready', INGAME:'ingame', RESULT:'result' };
  let screen = Screen.LOBBY;

  function setScreen(s){
    screen = s;
    ui.lobby.classList.toggle('active', s===Screen.LOBBY);
    ui.matching.classList.toggle('active', s===Screen.MATCHING);
    ui.ready.classList.toggle('active', s===Screen.READY);
    const inGame = s===Screen.INGAME;
    ui.hud.classList.toggle('show', inGame);
    ui.scoreBar.classList.toggle('show', inGame);
    ui.mobile.classList.toggle('show', inGame && innerWidth<=760);
    if(s!==Screen.INGAME){
      ui.levelup.style.display='none';
      ui.revive.style.display='none';
    }
    if(s!==Screen.RESULT) ui.result.style.display='none';
  }

  let toastTimer=0, msgTimer=0;
  function showMessage(text){
    ui.message.textContent=text; ui.message.style.opacity='1'; msgTimer=1.1;
  }
  function sysToast(text, ms=2200){
    ui.sysToast.textContent=text; ui.sysToast.style.opacity='1';
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{ui.sysToast.style.opacity='0'}, ms);
  }

  function hearts(n, max){
    let s='';
    for(let i=0;i<max;i++) s += i<n ? '●' : '<span class="empty">○</span>';
    return s;
  }

  // ---------- Net ----------
  let ws=null, playerId=null, netConfig=null, roomCfg=null;
  let scoreYou={kills:0,lives:3,alive:true,reviveAt:null,speedMul:1};
  let scoreOpp={kills:0,lives:3,alive:true,reviveAt:null,speedMul:1};
  let lastLagBonusOn=null;
  let injectDeniedAt=0;
  let killTargetK=30, livesN=3;
  let matchTimer=null, matchLeft=15, pingTimer=null;
  let opponentName='对手';
  let injectBurst={n:0,t:0};
  let injectHintAt=0;
  let seq=0;
  let pendingLevelUp=false;

  function connect(){
    return new Promise((resolve, reject)=>{
      try{
        ws = new WebSocket(WS_URL);
      }catch(e){ reject(e); return; }
      const to=setTimeout(()=>{reject(new Error('连接超时')); try{ws.close()}catch{}}, 5000);
      ws.onopen=()=>{
        clearTimeout(to);
        ws.send(JSON.stringify({type:'hello', playerName, clientVersion:'0.1'}));
      };
      ws.onmessage=(ev)=>{
        let msg; try{msg=JSON.parse(ev.data)}catch{return}
        if(msg.type==='welcome'){
          playerId=msg.playerId;
          netConfig=msg.config||{};
          killTargetK=netConfig.killTargetK||30;
          livesN=netConfig.livesN||3;
          startPing();
          resolve(msg);
          return;
        }
        onNet(msg);
      };
      ws.onerror=()=>{clearTimeout(to); reject(new Error('WS 连接失败'));};
      ws.onclose=()=>{
        stopPing();
        if(screen===Screen.INGAME || screen===Screen.MATCHING || screen===Screen.READY){
          sysToast('连接已断开');
          // if still in game without room.end, go lobby after short delay
        }
      };
    });
  }

  function startPing(){
    stopPing();
    pingTimer=setInterval(()=>{
      if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'ping', t:Date.now()}));
    }, 8000);
  }
  function stopPing(){ if(pingTimer){clearInterval(pingTimer);pingTimer=null} }

  function netSend(obj){
    if(ws && ws.readyState===1) ws.send(JSON.stringify(obj));
  }

  function onNet(msg){
    switch(msg.type){
      case 'pong': break;
      case 'match.queued':
        matchLeft = Math.ceil((msg.timeoutMs||15000)/1000);
        startMatchCountdown();
        break;
      case 'match.timeout':
        stopMatchCountdown();
        setScreen(Screen.LOBBY);
        sysToast('暂时没人，稍后再试');
        break;
      case 'match.found':
        opponentName = (msg.opponent && msg.opponent.playerName) || '对手';
        ui.readyNames.textContent = `你（${playerName}） · ${opponentName}`;
        break;
      case 'room.start':
        roomCfg = msg.config || {};
        killTargetK = roomCfg.killTargetK || killTargetK;
        livesN = roomCfg.livesN || livesN;
        scoreYou = {kills: msg.you?.kills||0, lives: msg.you?.lives||livesN, alive:true, reviveAt:null, speedMul:1};
        scoreOpp = {kills: msg.opponent?.kills||0, lives: msg.opponent?.lives||livesN, alive:true, reviveAt:null, speedMul:1};
        stopMatchCountdown();
        setScreen(Screen.READY);
        startBattle(msg.seed);
        setTimeout(()=>{
          if(screen===Screen.READY){
            setScreen(Screen.INGAME);
            updateScoreUI();
          }
        }, 1100);
        break;
      case 'room.score':
        scoreYou = Object.assign(scoreYou, msg.you||{});
        scoreOpp = Object.assign(scoreOpp, msg.opponent||{});
        if(msg.lagBonusOn==='you'){
          ui.lagTip.classList.add('on');
        } else {
          ui.lagTip.classList.remove('on');
        }
        if(msg.lagBonusOn==='you' && lastLagBonusOn!=='you'){
          showMessage('移速补偿生效');
        } else if(lastLagBonusOn==='you' && msg.lagBonusOn!=='you'){
          showMessage('补偿结束');
        }
        lastLagBonusOn = msg.lagBonusOn;
        // 命未尽只扣命：本地立刻回满 HP + 短无敌
        if(player && scoreYou.alive && scoreYou.lives>0 && !downed && player.hp<=0){
          player.hp = player.maxHp;
          player.invuln = Math.max(player.invuln||0, 0.55);
        }
        updateScoreUI();
        break;
      case 'combat.inject':
        // 协议含 to；缺省则忽略更安全
        if(msg.to===playerId){
          if(msg.queued) break;
          spawnInjected(msg.enemyType);
          const now=performance.now();
          if(now-injectBurst.t<800){ injectBurst.n++; }
          else { injectBurst={n:1,t:now}; }
          injectBurst.t=now;
          showMessage(injectBurst.n>1 ? `对手塞来 ×${injectBurst.n}` : `对手塞来 · ${typeName(msg.enemyType)}`);
        }
        break;
      case 'combat.inject_denied':
        // 极弱一次：长冷却，别吵
        {
          const now=performance.now();
          if(now-injectDeniedAt>10000){
            injectDeniedAt=now;
            sysToast(msg.message||'注入暂不可用', 1000);
          }
        }
        break;
      case 'combat.down':
        if(msg.playerId===playerId){
          enterRevive(msg.reviveAt);
        }
        break;
      case 'combat.revive':
        if(msg.playerId===playerId){
          doLocalRevive(msg.lives||livesN);
        } else {
          scoreOpp.lives = msg.lives||livesN;
          scoreOpp.alive = true;
          updateScoreUI();
        }
        break;
      case 'room.end':
        showResult(msg);
        break;
      case 'error':
        if(msg.code==='already_matched') sysToast(msg.message||'已在匹配中');
        break;
    }
  }

  function typeName(t){
    return t==='swift'?'疾影':t==='watcher'?'守望':'游魂';
  }

  function startMatchCountdown(){
    stopMatchCountdown();
    ui.matchRemain.textContent = `剩余 ${matchLeft}s`;
    matchTimer=setInterval(()=>{
      matchLeft--;
      if(matchLeft<0) matchLeft=0;
      ui.matchRemain.textContent = `剩余 ${matchLeft}s`;
      if(matchLeft<=0) stopMatchCountdown();
    },1000);
  }
  function stopMatchCountdown(){
    if(matchTimer){clearInterval(matchTimer);matchTimer=null}
  }

  function updateScoreUI(){

    ui.killYou.textContent = `${scoreYou.kills} / ${K}`;
    ui.killOpp.textContent = `${scoreOpp.kills} / ${K}`;

  // ---------- Game (Demo-aligned) ----------
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W=0,H=0;
  function resize(){
    W=innerWidth; H=innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize); resize();

  const world={w:3600,h:3600};
  const keys=new Set();
  const stick={x:0,y:0};
  let player, enemies, orbs, particles, flashes, trail;
  let localKills=0, elapsed=0, spawnClock=0, difficulty=1;
  let paused=false, downed=false, battleActive=false;
  let camera={x:0,y:0};
  let rng = Math.random;
  let baseSpeed=220;
  let upgradeSpeedMul=1;
  let levelUpQueued=false;
  let deathPending=false;

  const rand=(a,b)=>a+rng()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy};

  function mulberry32(a){
    return function(){
      let t=a+=0x6D2B79F5;
      t=Math.imul(t^t>>>15,t|1);
      t^=t+Math.imul(t^t>>>7,t|61);
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }

  function fmtTime(s){
    s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  }

  function polygonArea(poly){
    let a=0;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++) a+=(poly[j].x*poly[i].y-poly[i].x*poly[j].y);
    return Math.abs(a*0.5);
  }
  function pointInPoly(x,y,poly){
    let inside=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
      const hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi);
      if(hit) inside=!inside;
    }
    return inside;
  }

  function addParticle(x,y,kind='ink',count=7){
    for(let i=0;i<count;i++){
      const a=Math.random()*Math.PI*2,s=rand(30,150);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.75),max:.75,size:rand(2,5),kind});
    }
  }

  function enemyData(type){
    return type==='swift' ? {r:10,speed:132,sight:190,color:'#e8a15c',damage:10,xp:2}
      : type==='watcher' ? {r:16,speed:86,sight:330,color:'#a77aa8',damage:16,xp:3}
      : {r:13,speed:96,sight:245,color:'#d96159',damage:12,xp:1};
  }

  function spawnEnemy(forceNear=false, forcedType=null, isInject=false){
    const angle=Math.random()*Math.PI*2;
    let radius=forceNear?rand(470,680):rand(560,1050);
    if(isInject) radius=rand(380,620);
    let x=clamp(player.x+Math.cos(angle)*radius,60,world.w-60);
    let y=clamp(player.y+Math.sin(angle)*radius,60,world.h-60);
    let type=forcedType;
    if(!type){
      const roll=Math.random();
      type = roll < Math.min(.12 + elapsed/600, .24) ? 'swift' : roll > .91 ? 'watcher' : 'drifter';
    }
    const data=enemyData(type);
    enemies.push({x,y,...data,type,state:'wander',angle:Math.random()*Math.PI*2,wanderT:rand(.5,2.5),alert:0,attackCd:0,hitFlash:0,seed:Math.random()*9,injected:!!isInject, eid:'e_'+Math.random().toString(36).slice(2,9)});
  }

  function spawnInjected(type){
    if(!battleActive || !VALID_TYPE(type)) return;
    spawnEnemy(true, type, true);
  }
  function VALID_TYPE(t){ return t==='drifter'||t==='swift'||t==='watcher'; }

  function killEnemy(e, byLoop=true){
    if(e.dead) return;
    e.dead=true; localKills++;
    addParticle(e.x,e.y,'enemy',10);
    const n=e.xp;
    for(let i=0;i<n;i++) orbs.push({x:e.x+rand(-8,8),y:e.y+rand(-8,8),vx:rand(-20,20),vy:rand(-20,20),value:1});
    if(byLoop && localKills%20===0) showMessage('漂亮！ '+localKills+' 连斩');
    // report to server
    if(battleActive && !downed){
      seq++;
      netSend({type:'combat.kill', enemyType:e.type, enemyId:e.eid, seq});
      // optimistic local toast for inject feedback
      if(byLoop){ /* score comes from server */ }
    }
  }

  function tryCloseLoop(){
    const n=trail.length;
    if(n<24) return;
    const cur=trail[n-1];
    let best=-1, bestD=Infinity;
    const r2=player.closureRadius*player.closureRadius;
    for(let i=Math.max(0,n-250); i<n-16; i++){
      const p=trail[i];
      const d=dist2(cur.x,cur.y,p.x,p.y);
      if(d<r2 && d<bestD){best=i;bestD=d;}
    }
    if(best<0) return;
    const poly=trail.slice(best).map(p=>({x:p.x,y:p.y}));
    if(poly.length<16) return;
    const area=polygonArea(poly);
    if(area<player.minLoopArea) return;

    let count=0;
    for(const e of enemies){
      if(!e.dead && pointInPoly(e.x,e.y,poly)){ killEnemy(e,true); count++; }
    }
    flashes.push({poly,life:.55,max:.55,count});
    addParticle(player.x,player.y,'ink',15);
    if(count>0){
      showMessage('封圈 · '+count+' 杀');
      // 弱提示一次「已塞给对手」（与封圈文案错开，防刷屏）
      if(battleActive && !downed && scoreYou.alive){
        const now=performance.now();
        if(now-injectHintAt>1800){
          injectHintAt=now;
          setTimeout(()=>{
            if(battleActive && !downed && scoreYou.alive && screen===Screen.INGAME)
              showMessage('已塞给对手');
          }, 650);
        }
      }
    } else showMessage('空圈');
    trail=[{x:player.x,y:player.y,t:elapsed}];
  }

  function gainXp(v){
    player.xp += v;
    if(player.xp >= player.xpNeed && !paused){
      player.xp -= player.xpNeed;
      player.level++;
      player.xpNeed = Math.floor(12 + player.level*5.5 + player.level*player.level*.55);
      if(downed){ levelUpQueued=true; }
      else openLevelUp();
    }
  }

  const upgrades = [
    {icon:'➜',name:'轻步',desc:'移动速度 +12%，更容易迅速拉出大圈。',apply:()=>{upgradeSpeedMul*=1.12}},
    {icon:'◯',name:'宽容收笔',desc:'闭合判定距离 +5px，封圈更容易触发。',apply:()=>player.closureRadius+=5},
    {icon:'✦',name:'长锋画笔',desc:'保留的移动轨迹长度 +18%。',apply:()=>player.maxTrail=Math.floor(player.maxTrail*1.18)},
    {icon:'❤',name:'厚纸',desc:'最大生命 +25，并立即恢复 25。',apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
    {icon:'◎',name:'吸墨',desc:'经验吸取半径 +45。',apply:()=>player.pickup+=45},
    {icon:'⌁',name:'粗笔',desc:'画笔轨迹更明显；封圈时获得 0.45 秒无敌。',apply:()=>{player.trailWidth+=1.8; player.invuln=Math.max(player.invuln,.45)}},
    {icon:'◇',name:'大构图',desc:'最小封圈面积 -14%，小圈也更容易生效。',apply:()=>player.minLoopArea=Math.max(900,player.minLoopArea*.86)},
    {icon:'✚',name:'修补',desc:'立刻恢复 45 点生命。',apply:()=>player.hp=Math.min(player.maxHp,player.hp+45)}
  ];

  function openLevelUp(){
    paused=true; ui.levelup.style.display='flex'; ui.cards.innerHTML='';
    // 遮罩不可点关闭，必须点卡；复活中不抢开（由 levelUpQueued 延后）
    ui.levelup.onclick=(e)=>{ if(e.target===ui.levelup) e.stopPropagation(); };
    const pool=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);
    for(const up of pool){
      const b=document.createElement('button'); b.className='card';
      b.innerHTML=`<div class="icon">${up.icon}</div><h3>${up.name}</h3><p>${up.desc}</p>`;
      b.onclick=()=>{
        up.apply();
        ui.levelup.style.display='none';
        paused=false;
        showMessage(up.name+' 已强化');
        netSend({type:'meta.levelup', level:player.level, choiceId:up.name});
      };
      ui.cards.appendChild(b);
    }
  }

  function updateEnemy(e,dt){
    e.attackCd=Math.max(0,e.attackCd-dt); e.hitFlash=Math.max(0,e.hitFlash-dt);
    if(downed){ // still wander a bit
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rand(1,3.4);e.angle+=rand(-1.6,1.6);}
      const vx=Math.cos(e.angle)*e.speed*.27, vy=Math.sin(e.angle)*e.speed*.27;
      e.x=clamp(e.x+vx*dt,e.r,world.w-e.r); e.y=clamp(e.y+vy*dt,e.r,world.h-e.r);
      return;
    }
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy);
    if(d < e.sight){ e.state='alert'; e.alert=1.1; }
    else if(e.alert>0){ e.alert-=dt; }
    else e.state='wander';

    let vx=0,vy=0;
    if(e.state==='alert'){
      const inv=1/(d||1); vx=dx*inv*e.speed*(1+Math.min(elapsed/240,.34)); vy=dy*inv*e.speed*(1+Math.min(elapsed/240,.34));
      e.angle=Math.atan2(vy,vx);
    }else{
      e.wanderT-=dt;
      if(e.wanderT<=0){e.wanderT=rand(1,3.4);e.angle+=rand(-1.6,1.6);}
      vx=Math.cos(e.angle)*e.speed*.27; vy=Math.sin(e.angle)*e.speed*.27;
    }
    e.x=clamp(e.x+vx*dt,e.r,world.w-e.r); e.y=clamp(e.y+vy*dt,e.r,world.h-e.r);

    const rr=player.r+e.r;
    if(d<rr+3 && e.attackCd<=0 && player.invuln<=0){
      player.hp-=e.damage; player.invuln=.55; e.attackCd=.8; e.hitFlash=.18;
      const push=20/(d||1); player.x=clamp(player.x+dx*push,player.r,world.w-player.r); player.y=clamp(player.y+dy*push,player.r,world.h-player.r);
      addParticle(player.x,player.y,'hurt',8);
      if(player.hp<=0) onLocalDeath();
    }
  }

  function onLocalDeath(){
    if(downed || !battleActive || deathPending) return;
    deathPending=true;
    player.hp=0;
    player.invuln=1.0;
    seq++;
    netSend({type:'combat.hit', damageLives:1, seq});
    if((scoreYou.lives||1) > 1){
      setTimeout(()=>{
        deathPending=false;
        if(!downed && battleActive && scoreYou.alive && scoreYou.lives>0){
          player.hp=player.maxHp;
          player.invuln=0.55;
        }
      }, 80);
    } else {
      enterRevive(Date.now() + ((netConfig && netConfig.reviveMs) || 5000));
    }
  }

  let reviveLocalTimer=null;
  function enterRevive(reviveAt){
    downed=true;
    // 复活优先于升级：打断选卡时排队，复活后再开
    if(ui.levelup.style.display==='flex' || paused) levelUpQueued=true;
    paused=false; // only lock controls via downed
    ui.levelup.style.display='none';
    ui.revive.style.display='flex';
    let at=Number(reviveAt);
    if(!Number.isFinite(at) || at<=0){
      const ms=(netConfig&&netConfig.reviveMs)||(roomCfg&&roomCfg.reviveMs)||5000;
      at=Date.now()+ms;
    }
    const tick=()=>{
      // 倒计时用服务端剩余时间（reviveAt 绝对时刻）
      const left=Math.max(0, Math.ceil((at-Date.now())/1000));
      ui.reviveCount.textContent=String(left);
      if(left<=0){ /* wait for server revive */ }
    };
    tick();
    clearInterval(reviveLocalTimer);
    reviveLocalTimer=setInterval(tick, 200);
  }

  function doLocalRevive(lives){
    deathPending=false;
    clearInterval(reviveLocalTimer);
    ui.revive.style.display='none';
    downed=false;
    scoreYou.lives=lives;
    scoreYou.alive=true;
    player.hp=player.maxHp;
    player.invuln=0.55;
    player.x=world.w/2; player.y=world.h/2;
    trail=[{x:player.x,y:player.y,t:elapsed}];
    updateScoreUI();
    if(levelUpQueued){ levelUpQueued=false; openLevelUp(); }
  }

  function update(dt){
    if(!battleActive || screen===Screen.RESULT) return;
    // apply speedMul from server
    player.speed = baseSpeed * upgradeSpeedMul * (scoreYou.speedMul || 1);

    if(paused){ // levelup pause — still update message timer
      if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)ui.message.style.opacity='0';}
      return;
    }

    elapsed+=dt; difficulty=1+elapsed/75;
    player.invuln=Math.max(0,player.invuln-dt);

    // spawn baseline even when downed (map keeps living)
    spawnClock-=dt;
    if(spawnClock<=0){
      spawnClock=Math.max(.22,1.0/difficulty);
      if(enemies.length<180) spawnEnemy();
    }

    if(!downed){
      let mx=0,my=0;
      if(keys.has('KeyW')||keys.has('ArrowUp')) my--;
      if(keys.has('KeyS')||keys.has('ArrowDown')) my++;
      if(keys.has('KeyA')||keys.has('ArrowLeft')) mx--;
      if(keys.has('KeyD')||keys.has('ArrowRight')) mx++;
      mx+=stick.x; my+=stick.y;
      const ml=Math.hypot(mx,my);
      if(ml>0){
        mx/=ml; my/=ml;
        const ox=player.x,oy=player.y;
        player.x=clamp(player.x+mx*player.speed*dt,player.r,world.w-player.r);
        player.y=clamp(player.y+my*player.speed*dt,player.r,world.h-player.r);
        if(Math.hypot(player.x-ox,player.y-oy)>.01){
          const last=trail[trail.length-1];
          if(!last || dist2(player.x,player.y,last.x,last.y)>9*9){
            trail.push({x:player.x,y:player.y,t:elapsed});
            if(trail.length>player.maxTrail) trail.shift();
            tryCloseLoop();
          }
        }
      }
    }

    for(const e of enemies) if(!e.dead) updateEnemy(e,dt);
    enemies=enemies.filter(e=>!e.dead);

    if(!downed){
      for(const o of orbs){
        o.x+=o.vx*dt; o.y+=o.vy*dt; o.vx*=Math.pow(.08,dt);o.vy*=Math.pow(.08,dt);
        const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy);
        if(d<player.pickup){const f=1-d/player.pickup;o.x+=dx*dt*(4+f*10);o.y+=dy*dt*(4+f*10);}
        if(d<player.r+8){o.dead=true;gainXp(o.value);}
      }
      orbs=orbs.filter(o=>!o.dead);
    }

    for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.09,dt);p.vy*=Math.pow(.09,dt)}
    particles=particles.filter(p=>p.life>0);
    for(const f of flashes) f.life-=dt;
    flashes=flashes.filter(f=>f.life>0);

    const cx = downed ? camera.x : player.x;
    const cy = downed ? camera.y : player.y;
    camera.x += (cx-camera.x)*(1-Math.pow(.001,dt));
    camera.y += (cy-camera.y)*(1-Math.pow(.001,dt));

    if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)ui.message.style.opacity='0';}
    updateLocalUI();
  }

  function updateLocalUI(){
    ui.level.textContent=player.level;
    ui.time.textContent=fmtTime(elapsed);
    ui.hp.textContent=Math.ceil(player.hp)+'/'+player.maxHp;
    ui.xp.textContent=player.xp+'/'+player.xpNeed;
    ui.hpFill.style.width=(100*clamp(player.hp/player.maxHp,0,1))+'%';
    ui.xpFill.style.width=(100*clamp(player.xp/player.xpNeed,0,1))+'%';
  }

  function sx(x){return x-camera.x+W/2} function sy(y){return y-camera.y+H/2}
  function visible(x,y,pad=60){const xx=sx(x),yy=sy(y);return xx>-pad&&xx<W+pad&&yy>-pad&&yy<H+pad}

  function drawGrid(){
    ctx.fillStyle='#101719';ctx.fillRect(0,0,W,H);
    const step=58;
    const ox=((W/2-camera.x)%step+step)%step, oy=((H/2-camera.y)%step+step)%step;
    ctx.strokeStyle='rgba(232,226,205,.035)';ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=ox;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H)}
    for(let y=oy;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y)}
    ctx.stroke();
    const left=sx(0),right=sx(world.w),top=sy(0),bottom=sy(world.h);
    ctx.strokeStyle='rgba(242,166,90,.18)';ctx.lineWidth=4;ctx.strokeRect(left,top,right-left,bottom-top);
  }
  function drawTrail(){
    if(trail.length<2) return;
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='rgba(244,180,99,.17)';ctx.lineWidth=player.trailWidth+9;ctx.beginPath();
    ctx.moveTo(sx(trail[0].x),sy(trail[0].y));
    for(let i=1;i<trail.length;i++)ctx.lineTo(sx(trail[i].x),sy(trail[i].y));ctx.stroke();
    ctx.strokeStyle='#efcf98';ctx.lineWidth=player.trailWidth;ctx.beginPath();ctx.moveTo(sx(trail[0].x),sy(trail[0].y));
    for(let i=1;i<trail.length;i++)ctx.lineTo(sx(trail[i].x),sy(trail[i].y));ctx.stroke();
    ctx.strokeStyle='rgba(255,248,219,.75)';ctx.lineWidth=Math.max(1.2,player.trailWidth*.24);ctx.stroke();
    ctx.restore();
  }
  function drawFlashes(){
    for(const f of flashes){
      const a=f.life/f.max;
      ctx.beginPath();ctx.moveTo(sx(f.poly[0].x),sy(f.poly[0].y));
      for(let i=1;i<f.poly.length;i++)ctx.lineTo(sx(f.poly[i].x),sy(f.poly[i].y));ctx.closePath();
      ctx.fillStyle=`rgba(242,166,90,${.17*a})`;ctx.fill();
      ctx.strokeStyle=`rgba(255,231,180,${.95*a})`;ctx.lineWidth=3+5*(1-a);ctx.stroke();
    }
  }
  function drawOrbs(){
    for(const o of orbs){if(!visible(o.x,o.y))continue;const x=sx(o.x),y=sy(o.y);ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle='#9bcf7f';ctx.fill();}
  }
  function drawEnemy(e){
    if(!visible(e.x,e.y,e.sight+20))return;
    const x=sx(e.x),y=sy(e.y);
    if(dist2(player.x,player.y,e.x,e.y)<(e.sight+130)*(e.sight+130)){
      ctx.beginPath();ctx.arc(x,y,e.sight,0,Math.PI*2);
      ctx.strokeStyle=e.state==='alert'?'rgba(230,101,91,.19)':'rgba(207,215,205,.055)';ctx.lineWidth=1;ctx.stroke();
    }
    ctx.save();ctx.translate(x,y);ctx.rotate(e.angle);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fillStyle=e.hitFlash>0?'#fff2d5':e.color;ctx.fill();
    ctx.shadowColor='transparent';
    ctx.fillStyle='#2b2422';ctx.beginPath();ctx.arc(e.r*.36,-e.r*.18,2.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.r*.36,e.r*.18,2.2,0,Math.PI*2);ctx.fill();
    if(e.injected){ctx.strokeStyle='rgba(242,166,90,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r+3,0,Math.PI*2);ctx.stroke();}
    ctx.restore();
  }
  function drawPlayer(){
    if(downed) return;
    const x=sx(player.x),y=sy(player.y);
    ctx.save();ctx.translate(x,y);
    if(player.invuln>0){ctx.beginPath();ctx.arc(0,0,player.r+7+Math.sin(elapsed*22)*2,0,Math.PI*2);ctx.strokeStyle='rgba(255,240,193,.65)';ctx.lineWidth=2;ctx.stroke();}
    ctx.shadowColor='rgba(242,166,90,.32)';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fillStyle='#f2ead4';ctx.fill();
    ctx.shadowColor='transparent';
    ctx.beginPath();ctx.arc(-3,-3,4.2,0,Math.PI*2);ctx.fillStyle='#fffdf4';ctx.fill();
    ctx.fillStyle='#253033';ctx.fillRect(-2,-6,4,13);
    ctx.fillStyle='#d88d52';ctx.beginPath();ctx.moveTo(-4,6);ctx.lineTo(4,6);ctx.lineTo(0,12);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  function drawParticles(){
    for(const p of particles){if(!visible(p.x,p.y))continue;const a=clamp(p.life/p.max,0,1);const color=p.kind==='enemy'?'rgba(224,100,83,':p.kind==='hurt'?'rgba(255,224,183,':'rgba(241,208,151,';ctx.fillStyle=color+a+')';ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),p.size*a+.5,0,Math.PI*2);ctx.fill();}
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!battleActive && screen!==Screen.INGAME && screen!==Screen.READY){
      ctx.fillStyle='#0f1517';ctx.fillRect(0,0,W,H);
      return;
    }
    drawGrid(); drawFlashes(); drawOrbs();
    for(const e of enemies) drawEnemy(e);
    drawTrail(); drawParticles(); drawPlayer();
    if(!downed && trail.length>18){ctx.beginPath();ctx.arc(sx(player.x),sy(player.y),player.closureRadius,0,Math.PI*2);ctx.strokeStyle='rgba(243,223,179,.12)';ctx.lineWidth=1;ctx.stroke();}
  }

  function startBattle(seedVal){
    upgradeSpeedMul=1;
    rng = seedVal ? mulberry32(seedVal>>>0) : Math.random;
    baseSpeed=220;
    player={
      x:world.w/2,y:world.h/2,r:13,speed:220,
      hp:100,maxHp:100,invuln:0,
      pickup:85,closureRadius:28,minLoopArea:2300,
      trailWidth:7,maxTrail:520,inkLife:16,
      level:1,xp:0,xpNeed:12
    };
    enemies=[];orbs=[];particles=[];flashes=[];trail=[];
    localKills=0;elapsed=0;spawnClock=0;difficulty=1;
    paused=false;downed=false;battleActive=true;levelUpQueued=false;deathPending=false;
    camera.x=player.x;camera.y=player.y;
    for(let i=0;i<26;i++) spawnEnemy(i<12);
    updateLocalUI();
    updateScoreUI();
  }

  function stopBattle(){
    battleActive=false;
    paused=true;
    clearInterval(reviveLocalTimer);
    ui.levelup.style.display='none';
    ui.revive.style.display='none';
  }

  function showResult(msg){
    // Result 抢占子层：先关 revive/levelup，再开结算
    ui.levelup.style.display='none';
    ui.revive.style.display='none';
    clearInterval(reviveLocalTimer);
    stopBattle();
    setScreen(Screen.RESULT);
    ui.result.style.display='flex';
    const win = msg.winnerId && msg.winnerId===playerId;
    ui.resultTitle.textContent = win ? '猎场封圈' : '墨尽人散';
    ui.resultTitle.className = win ? 'win' : 'lose';
    const yk=msg.you?.kills??scoreYou.kills;
    const ok=msg.opponent?.kills??scoreOpp.kills;
    ui.resultScore.textContent = `你 ${yk} · 对手 ${ok}`;
    ui.resultMeta.textContent = `用时 ${fmtTime(elapsed)} · 等级 ${player?.level||1} · 本方击杀 ${yk}`;
  }

  function backToLobby(){
    stopBattle();
    ui.result.style.display='none';
    setScreen(Screen.LOBBY);
  }

  // ---------- Input ----------
  addEventListener('keydown',e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  });
  addEventListener('keyup',e=>keys.delete(e.code));

  const base=el('stickBase'), knob=el('stickKnob');
  let stickId=null;
  function setStick(ev){
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=ev.clientX-cx,dy=ev.clientY-cy;const m=Math.hypot(dx,dy),max=42;
    if(m>max){dx=dx/m*max;dy=dy/m*max}
    stick.x=dx/max;stick.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
  }
  base.addEventListener('pointerdown',e=>{stickId=e.pointerId;base.setPointerCapture(stickId);setStick(e)});
  base.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});
  function releaseStick(e){if(stickId===null||e.pointerId===stickId){stickId=null;stick.x=stick.y=0;knob.style.transform='translate(0,0)'}}
  base.addEventListener('pointerup',releaseStick);base.addEventListener('pointercancel',releaseStick);

  // ---------- Buttons ----------
  let connecting=false;
  el('btnMatch').onclick = async ()=>{
    if(connecting) return;
    connecting=true;
    el('btnMatch').disabled=true;
    try{
      if(!ws || ws.readyState!==1){
        await connect();
      }
      setScreen(Screen.MATCHING);
      matchLeft=Math.ceil((netConfig?.matchTimeoutMs||15000)/1000);
      ui.matchRemain.textContent=`剩余 ${matchLeft}s`;
      netSend({type:'match.join'});
    }catch(err){
      sysToast('无法连接服务器：'+((err&&err.message)||err));
      setScreen(Screen.LOBBY);
    }finally{
      connecting=false;
      el('btnMatch').disabled=false;
    }
  };

  el('btnCancel').onclick = ()=>{
    netSend({type:'match.cancel'});
    stopMatchCountdown();
    setScreen(Screen.LOBBY);
  };

  el('btnLobby').onclick = backToLobby;

  el('adRevivePlaceholder').onclick = ()=>sysToast('广告占位（未接 SDK）');
  el('adResultPlaceholder').onclick = ()=>sysToast('广告占位（未接 SDK）');

  // ---------- Loop ----------
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.034,(now-last)/1000||0); last=now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
